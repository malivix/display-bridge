name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install publication scanner
        run: brew install gitleaks
      - name: Verify source and native helpers
        run: ./scripts/verify --native
      - name: Check committed history
        run: ./scripts/public-check --history
      - name: Check conventional commit subjects
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            ./scripts/check-commit --range "$PR_BASE..$PR_HEAD"
          else
            ./scripts/check-commit --range HEAD
          fi
